[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
normandy_core = "3kXtyEqYxGTTnUtCpVNVwNwQjRZPYfGkEZo75tQtdwLs"
normandy_hook_fixed_term = "He2SZJXMwPnyjN3dfuV8VEU2TPU58oR1HSWFkYvUgnNC"
normandy_hook_sati_score = "5JGmhFpyEMapoDy7WkN3HeaASCeRdya2rC3utXPi5DwL"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Pre-load static SAS attestation fixtures into solana-test-validator at startup.
# Generated by scripts/build-satscore-fixtures.ts. Re-run that script if the SAS
# or SATI byte layout changes.
[test.validator]
bind_address = "127.0.0.1"

[[test.validator.account]]
address = "FgavPJLys9oZ6RzAX1o93HYQG2jv7Uwp9XdMda2sjoHw"
filename = "tests/fixtures/satscore-happy-account.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
